<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Happy Birthday 🎉</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top, #ff9a9e, #fad0c4, #fad0c4);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Floating hearts animation */
    .heart {
      position: absolute;
      bottom: -20px;
      font-size: 20px;
      animation: floatUp 6s linear infinite;
      opacity: 0.8;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-110vh) scale(1.5); opacity: 0; }
    }
  

    .card {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 25px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 360px;
      animation: zoomIn 1s ease;
    }

    @keyframes zoomIn {
      from { transform: scale(0.6); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    h1 {
      font-size: 2.3rem;
      color: #fff;
      margin-bottom: 10px;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #fff; }
      to { text-shadow: 0 0 25px #ff4b5c; }
    }

    .photo {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #fff;
      margin: 15px 0;
      animation: rotatePic 6s linear infinite;
    }

    @keyframes rotatePic {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    p {
      color: #fff;
      font-size: 1.1rem;
      margin-bottom: 20px;
    }

    button {
      padding: 12px 28px;
      font-size: 1rem;
      border: none;
      border-radius: 30px;
      background: #ff4b5c;
      color: white;
      cursor: pointer;
      transition: transform 0.3s;
    }

    button:hover {
      transform: scale(1.1);
      background: #ff1e38;
    }

    .surprise {
      display: none;
      color: #fff;
      margin-top: 20px;
      animation: pop 0.6s ease;
    }

    @keyframes pop {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style></head>
<body>  <!-- Floating hearts -->  <div class="heart" style="left:10%; animation-delay:0s">❤️</div>
  <div class="heart" style="left:30%; animation-delay:1s">💖</div>
  <div class="heart" style="left:50%; animation-delay:2s">❤️</div>
  <div class="heart" style="left:70%; animation-delay:3s">💗</div>
  <div class="heart" style="left:90%; animation-delay:4s">❤️</div>  <div class="card">
    <h1>🎂 Happy Birthday 🎂</h1><!-- PHOTO HERE -->
<img src="photo.jpg" alt="Birthday Person" class="photo" />

<p>Aaj ka din sirf aapke naam 💖</p>

<button onclick="showSurprise()">Click for Surprise 🎁</button>

<div class="surprise" id="surpriseBox">
  <h2>🎉 Surprise! 🎉</h2>
  <p>
    aapki zindagi hamesha khushiyon se bhari rahe 🌟<br>
    Saare sapne poore ho 💫<br>
    Aur smile kabhi kam na ho 😊
  </p>
</div>

  </div>  <script>
    function showSurprise() {
      document.getElementById('surpriseBox').style.display = 'block';
    }
  </script></body>
</html>
